<!DOCTYPE html>
<html>
<head>
    <title>Simple Event Handling</title>
</head>
<body>

    <h2>Simple Event Handling Example</h2>

    <button onclick="showMessage()">
        Click Me
    </button>

    <p id="output"></p>

    <script>
        function showMessage() {
            document.getElementById("output").innerHTML =
                "Button was clicked!";
        }
    </script>

</body>
</html>
