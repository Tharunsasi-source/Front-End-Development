<!DOCTYPE html>
<html>
<head>
    <title>Hotel Suggestions</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .hotel-card {
            background: white;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
            overflow: hidden;
            text-align: center;
        }

        .hotel-card img {
            width: 100%;
            height: 200px;
        }

        .hotel-card h2 {
            margin: 10px 0;
        }

        .hotel-card p {
            padding: 0 10px;
        }

        button {
            background-color: green;
            color: white;
            padding: 10px 15px;
            margin-bottom: 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkgreen;
        }
    </style>
</head>

<body>

    <h1>Popular Hotels</h1>

    <div class="container">

        <!-- Hotel 1 -->
        <div class="hotel-card">
            <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945" alt="Hotel 1">

            <h2>Star Hotel</h2>

            <p>Luxury rooms with free WiFi and tasty food.</p>

            <h3>₹1500 / Night</h3>

            <button onclick="bookHotel('Star Hotel')">
                Book Now
            </button>
        </div>

        <!-- Hotel 2 -->
        <div class="hotel-card">
            <img src="https://images.unsplash.com/photo-1551882547-ff40c63fe5fa" alt="Hotel 2">

            <h2>Sea View Hotel</h2>

            <p>Beautiful beach view and swimming pool.</p>

            <h3>₹2200 / Night</h3>

            <button onclick="bookHotel('Sea View Hotel')">
                Book Now
            </button>
        </div>

        <!-- Hotel 3 -->
        <div class="hotel-card">
            <img src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267" alt="Hotel 3">

            <h2>Green Park Hotel</h2>

            <p>Peaceful environment with garden view rooms.</p>

            <h3>₹1800 / Night</h3>

            <button onclick="bookHotel('Green Park Hotel')">
                Book Now
            </button>
        </div>

    </div>

    <h2 id="message" style="text-align:center; color:green;"></h2>

    <script>
        function bookHotel(hotelName) {
            document.getElementById("message").innerHTML =
                hotelName + " booked successfully!";
        }
    </script>

</body>
</html>
