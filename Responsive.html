<!DOCTYPE html>
<html>
<head>
    <title>Responsive Website</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, sans-serif;
        }

        header{
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav{
            background-color: #555;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        nav a{
            color: white;
            text-decoration: none;
            padding: 15px 20px;
        }

        nav a:hover{
            background-color: #222;
        }

        .container{
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
        }

        .box{
            flex: 1;
            min-width: 250px;
            margin: 10px;
            padding: 20px;
            background-color: #f2f2f2;
            border-radius: 10px;
            text-align: center;
        }

        footer{
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }

        @media(max-width: 600px){

            header{
                font-size: 18px;
            }

            nav{
                flex-direction: column;
                text-align: center;
            }
        }

    </style>
</head>

<body>

    <header>
        <h1>My Responsive Website</h1>
        <p>Simple HTML & CSS Responsive Design</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">

        <div class="box">
            <h2>Web Design</h2>
            <p>Create modern and responsive websites.</p>
        </div>

        <div class="box">
            <h2>Development</h2>
            <p>Build fast and user-friendly applications.</p>
        </div>

        <div class="box">
            <h2>Support</h2>
            <p>24/7 support for your business website.</p>
        </div>

    </div>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
